<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرین</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            flex-wrap: wrap;
    
        }
        body {
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            background: url(vail-wallpaper-3840x2160-usa-4k-8260.jpg);   
        }
        header { 
            display: flex;
            justify-content: space-between;
            
            
        }
        .links {
            display: flex;
            flex-direction: row-reverse;
            background-color: #222;
            text-align: center;
    
        }
        .links a {
            display: flex;
            color: white;
            text-decoration: none;
            font-size: 25px;
            height: 100px;
            width: 150px;
            align-items: center;
            justify-content: center;
            position: relative;
            top: 0;
            transition: 1s;
            z-index: 1;
            
            
           
        }
        .links a:hover {
            color: white;
            background-color: rgb(248, 14, 14);
            position: relative;
            top: 20px;
        
        }
        .logo {
            display: flex;
            color: rgb(42, 104, 240);
            font-size: 40px;
            flex: 1;
            height: 100px;
            background-color: #222;
            align-items: center;
        
        }
        .logo p {
            position: relative;
            left: 40px;
        }
        .main { 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            top: 100px;
            
        }
        .main h1 {
            display: flex;
            flex: 1;
            color: rgb(204, 26, 65);
            font-size: 90px;
            font-style: italic;
            
        }
      
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><p>سایت من</p></div>
        <nav class="links">
           <a href="#">صفحه اصلی</a>
           <a href="#">درباره ما</a>
           <a href="#">تماس با ما</a>
           <a href="index2.html">ثبت نام</a>
        </nav>
    </header>
    <main class="main">
        <h1>welcome</h1>
        <section class="section1">
            
        </section>
    </main>


</body>
</html>
